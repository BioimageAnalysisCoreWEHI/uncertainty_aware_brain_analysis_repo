project:
  output_dir: "results"

atlas:
  name: "perens_lsfm_mouse_20um"
  reference_image: "config/perens_lsfm_mouse_20um_coronal.tif"
  resolution_um: 20
  snpc_label: 374
  additional_labels: [749, 797, 381, 313, 128, 214, 246, 591, 397, 12, 697, 364]  
  # [VTA, ZI, SNr, MB, MRN, RN, RR, CLI, vtd, if, ml, PSTN]

brainreg:
  version: "1.0.10"   # as installed in the HPC environment and recorded in the run logs
  grid_spacing: [-2, -3, -5, -10, -30, -50]
  bending_energy_weight: [0.0, 0.1,0.3,0.5,0.7,0.9,0.95, 1.0]
  smoothing_sigma_floating: [-1.0]
  output_root: results/brainreg_sweeps
  orientation: sal
  voxel_size: [20, 20, 20]
  affine_n_steps: 3
  affine_use_n_steps: 2
  freeform_n_steps: 4
  freeform_use_n_steps: 4

qc:
  iou_threshold: 0.9
  grad_p95_threshold: 0.045
  ssim_top_fraction: 0.5

roi:
  bbox_json: "config/midbrain_bbox.json"

consensus:
  thresholds: [0.01, 0.1, 0.25, 0.5, 0.75, 1.0]

cellpose:
  model_type: cyto2
  #custom_weights: "<IMAGING>//Pradeep/Verena/Grant_Dewson/level1_cropped/cellpose/final_model/CP_epochs500_lr0.1_SGD_True_wd_1e-05"  # or null
  custom_weights: "<IMAGING>/Ishrat/analysis_of_whole_brain_projects/updating_cellpose_model/final_model/updated_th_model_dense_annotations_with_aug"
  diameter: 9
  channels: [0, 0]
  flow_threshold: 0.8
  cellprob_threshold: -2.0
  stitch_threshold: 0.3
  use_gpu: true

brainreg_outputs:
  # Flat copy of brainreg outputs: <root>/<sample_id>/<input_type>/<reg_name>__registered_atlas.tiff
  # (+ one downsampled.tiff per sample). Remove to read from each row's save_dir instead.
  collected_images_root: "<IMAGING>/Ishrat/analysis_of_whole_brain_projects/results/registration_images_collected"
  registered_atlas_names: ["registered_atlas.tiff", "registered_atlas.tif"]
  downsampled_standard_names: ["downsampled_standard.tiff", "downsampled_standard.tif"]
  deformation_field_names:
    - "deformation_field_0.tiff"
    - "deformation_field_1.tiff"
    - "deformation_field_2.tiff"